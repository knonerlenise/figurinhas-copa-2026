<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FWC 2026" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Figurinhas Copa 2026</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --border: #0b1220;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --miss: #475569;
    --ok: #22c55e;
    --trade: #3b82f6;
    --lvl-red: #ef4444;
    --lvl-orange: #f97316;
    --lvl-yellow: #eab308;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }

  /* ===== APP CONTAINER (mobile-sized on desktop) ===== */
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 30px rgba(0,0,0,0.35);
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .back {
    background: transparent; border: none; color: var(--accent);
    font-size: 22px; font-weight: 700; cursor: pointer; padding: 0 4px;
  }
  .topbar .titles { flex: 1; min-width: 0; }
  .topbar .title { font-size: 13px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .topbar .progress-row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .topbar .progress-num { font-size: 22px; font-weight: 700; }
  .topbar .progress-pct { font-size: 13px; color: var(--muted); }
  .topbar .bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .topbar .bar > div { height: 100%; background: var(--ok); transition: width 0.2s; }
  .topbar .stat-pills { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; font-size: 11px; }
  .pill { padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .pill.ok { color: var(--ok); }
  .pill.trade { color: var(--trade); }

  /* ===== HOME (2-col group cards) ===== */
  .home { padding: 12px 12px 80px; }
  .home-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .group-card {
    background: var(--panel);
    border: 1px solid var(--panel-2);
    border-radius: 12px;
    padding: 10px 10px 8px;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform 0.06s ease, border-color 0.15s;
    user-select: none;
  }
  .group-card:active { transform: scale(0.98); }
  .group-card.complete { border-color: var(--accent); }
  .gc-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .gc-name { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
  .gc-count { font-size: 11px; color: var(--muted); font-weight: 600; }
  .gc-bar {
    height: 4px; background: var(--border); border-radius: 2px;
    overflow: hidden; margin-bottom: 8px;
  }
  .gc-bar > div { height: 100%; background: var(--ok); transition: width 0.2s; }
  .group-card.complete .gc-bar > div { background: var(--accent); }
  .gc-list { display: flex; flex-direction: column; gap: 6px; }
  .gc-row {
    display: grid; grid-template-columns: 18px 32px 1fr 14px;
    align-items: center; gap: 6px;
    font-size: 11px;
  }
  .gc-row .gc-flag { font-size: 14px; line-height: 1; }
  .gc-row .gc-code { font-weight: 700; letter-spacing: 0.3px; }
  .gc-row .gc-pbar {
    height: 6px; background: var(--border);
    border-radius: 3px; overflow: hidden;
  }
  .gc-row .gc-pbar > div { height: 100%; transition: width 0.2s; }
  .gc-row .gc-dupes {
    font-size: 11px; font-weight: 500; font-style: italic; color: var(--trade);
    font-variant-numeric: tabular-nums;
    text-align: right; line-height: 1;
  }

  /* ===== COUNTRY VIEW: tabs + pills ===== */
  .group-tabs {
    display: flex; gap: 4px; overflow-x: auto;
    padding: 8px 12px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .country-block { scroll-margin-top: 8px; }
  .country-block + .country-block {
    margin-top: 6px; border-top: 1px solid var(--border);
  }
  .group-tabs::-webkit-scrollbar { display: none; }
  .group-tab {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px; font-weight: 700;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .group-tab.active { background: var(--border); color: var(--text); border-color: var(--accent); }

  .country-pills {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .country-pill {
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-2);
    cursor: pointer;
    min-height: 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .country-pill.active { border-color: var(--accent); background: var(--border); }
  .country-pill.span-2 { grid-column: 1 / -1; }
  .country-pill .pill-name { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
  .country-pill .pill-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .country-pill .pill-meta .meta-owned { font-weight: 700; }
  .country-pill .pill-meta .meta-dupes { font-style: italic; color: var(--trade); margin-left: 2px; }
  .country-pill .pill-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .country-pill .pill-bar > div { height: 100%; transition: width 0.2s; }

  /* ===== COUNTRY (drill) ===== */
  .country-screen { padding-bottom: 80px; }
  .country-header {
    padding: 14px 16px 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .country-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .country-header .header-meta { font-size: 12px; color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 4px 12px 16px;
  }
  .tile {
    aspect-ratio: 1 / 1.1;
    border-radius: 10px;
    background: var(--miss);
    color: white;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 6px 5px 7px;
    text-align: center;
    position: relative;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: transform 0.06s ease, background 0.15s;
  }
  .tile:active { transform: scale(0.94); }
  .tile.ok { background: var(--ok); }
  .tile.trade { background: var(--trade); }
  .tile .name {
    font-size: 10px; font-weight: 600; opacity: 0.9;
    line-height: 1.1;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    word-break: break-word;
    width: 100%;
    padding: 1px 0 2px;
  }
  .tile .id {
    font-size: 22px; font-weight: 800; letter-spacing: 0.3px;
    text-transform: uppercase;
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
  }
  .tile .badge {
    position: absolute;
    top: 3px; right: 4px;
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 10px; font-weight: 700;
    border-radius: 6px;
    padding: 1px 5px;
    min-width: 14px;
    text-align: center;
  }
  .tile.foil::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  .tile.foil-owned::before {
    border: 2px solid #fbbf24;
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.55);
  }
  .tile.foil-miss::before {
    border: 2px solid var(--muted);
  }

  /* ===== TRADE SCREEN ===== */
  .trade-screen { padding: 12px 12px 80px; }
  .trade-summary {
    background: var(--panel);
    border: 1px solid var(--panel-2);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .trade-summary .ts-num {
    font-size: 28px; font-weight: 700; color: var(--trade);
    font-variant-numeric: tabular-nums;
  }
  .trade-summary .ts-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .trade-empty {
    text-align: center; color: var(--muted);
    padding: 40px 20px; font-size: 14px;
    background: var(--panel); border-radius: 12px;
  }
  .trade-group { margin-bottom: 14px; }
  .trade-group-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 4px 6px;
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .trade-group-header .tgh-count {
    font-weight: 600;
    color: var(--trade);
    font-style: italic;
  }
  .trade-list { display: flex; flex-direction: column; gap: 6px; }
  .trade-row-wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
  }
  .trade-row-action {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 18px;
    background: var(--lvl-red);
    color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 0.5px;
  }
  .trade-row {
    position: relative;
    display: grid;
    grid-template-columns: 70px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--panel-2);
    border-radius: 10px;
    cursor: grab;
    touch-action: pan-y;
    transition: border-color 0.12s, transform 0.18s ease;
  }
  .trade-row:hover { border-color: var(--accent); }
  .trade-row .tr-code {
    font-size: 13px; font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 4px;
  }
  .trade-row .tr-foil { color: #fbbf24; font-size: 11px; }
  .trade-row .tr-info { min-width: 0; }
  .trade-row .tr-name {
    font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trade-row .tr-country {
    font-size: 11px; color: var(--muted); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trade-row .tr-count {
    font-size: 15px; font-weight: 500; font-style: italic;
    color: var(--trade);
    font-variant-numeric: tabular-nums;
  }

  /* ===== STATS SCREEN ===== */
  .stats-screen { padding: 12px 12px 80px; }
  .stats-hero {
    background: var(--panel); border: 1px solid var(--panel-2);
    border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px;
  }
  .stats-hero .sh-row {
    display: flex; align-items: baseline; gap: 8px;
  }
  .stats-hero .sh-num {
    font-size: 32px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stats-hero .sh-pct { font-size: 13px; color: var(--muted); }
  .stats-hero .sh-sub {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .stats-hero .sh-bar {
    height: 8px; background: var(--border); border-radius: 4px;
    overflow: hidden; margin-top: 10px;
  }
  .stats-hero .sh-bar > div { height: 100%; transition: width 0.2s; }
  .stats-quad {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px; margin-bottom: 16px;
  }
  .stat-card {
    background: var(--panel); border: 1px solid var(--panel-2);
    border-radius: 10px; padding: 10px 12px;
  }
  .stat-card .sc-num {
    font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .stat-card .sc-sub { font-size: 11px; color: var(--muted); }
  .stat-card .sc-label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;
  }
  .stat-card.dupes .sc-num { color: var(--trade); }
  .stat-card.miss .sc-num { color: var(--lvl-red); }
  .stat-card.foils .sc-num { color: #fbbf24; }
  .stats-section { margin-bottom: 16px; }
  .stats-section-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 0 4px 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .stats-section-title .sst-hint {
    color: var(--muted); font-weight: 400; font-style: italic;
    text-transform: none; letter-spacing: 0; font-size: 11px;
  }
  .stats-list { display: flex; flex-direction: column; gap: 6px; }
  .stats-row {
    display: grid;
    grid-template-columns: 22px 50px 1fr auto;
    align-items: center; gap: 8px;
    padding: 9px 12px;
    background: var(--panel); border: 1px solid var(--panel-2);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.12s, transform 0.06s ease;
  }
  .stats-row:active { transform: scale(0.99); }
  .stats-row:hover { border-color: var(--accent); }
  .stats-row .sr-flag { font-size: 16px; line-height: 1; }
  .stats-row .sr-code {
    font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
  }
  .stats-row .sr-name {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stats-row .sr-stat {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .stats-row.dupes .sr-stat {
    color: var(--trade); font-style: italic; font-weight: 500;
  }
  .stats-empty {
    font-size: 12px; color: var(--muted); padding: 12px;
    text-align: center; background: var(--panel); border-radius: 10px;
  }

  /* ===== FOOTER ===== */
  .footer {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(2, 1fr);
    text-align: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .footer button {
    background: none; border: none; color: var(--muted);
    padding: 14px 0; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .footer button.active { color: var(--accent); }
  .footer button.disabled { opacity: 0.45; }

  /* ===== MATCH SCREEN ===== */
  .match-screen { padding: 12px 12px 80px; }
  .match-actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .match-btn {
    flex: 1; padding: 11px 10px; border-radius: 10px;
    border: 1px solid var(--panel-2); background: var(--panel);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .match-btn.primary { background: var(--accent); border-color: var(--accent); color: #04121f; }
  .match-msg { font-size: 12px; min-height: 16px; margin-bottom: 8px; color: var(--muted); }
  .match-msg.err { color: var(--lvl-red); }
  .match-msg.ok { color: var(--ok); }
  .match-empty {
    text-align: center; color: var(--muted);
    padding: 40px 20px; font-size: 14px;
    background: var(--panel); border-radius: 12px;
  }
  .match-empty-sm { color: var(--muted); font-size: 12px; padding: 6px 4px; }
  .match-hero {
    background: var(--panel); border: 1px solid var(--panel-2);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .match-hero .mh-owner { font-size: 15px; font-weight: 700; }
  .match-hero .mh-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .match-hero .mh-reset {
    border: 1px solid var(--panel-2); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .match-section { margin-bottom: 18px; }
  .match-section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 4px 8px; font-size: 13px; font-weight: 700;
  }
  .match-section-title .mst-hint { color: var(--muted); font-weight: 600; font-size: 12px; }
  .match-group { margin-bottom: 10px; }
  .match-group-h {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px; padding: 0 4px 4px;
  }
  .match-row {
    display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--panel-2);
    border-radius: 10px; margin-bottom: 4px;
  }
  .match-row .mr-code {
    font-size: 13px; font-weight: 700; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 4px;
  }
  .match-row .mr-code.recv { color: var(--ok); }
  .match-row .mr-code.give { color: var(--trade); }
  .match-row .mr-name {
    font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .match-row .mr-country { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .match-reset-wrap { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--panel-2); }
  .match-reset {
    width: 100%; padding: 10px; border-radius: 10px;
    border: 1px solid var(--lvl-red); background: transparent; color: var(--lvl-red);
    font-size: 12px; font-weight: 600; cursor: pointer;
  }

  /* ===== HELP CARD (fim de cada tela) ===== */
  .help-card {
    margin: 18px 4px 0;
    padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px dashed var(--panel-2);
    border-radius: 10px;
  }
  .help-card .help-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px;
  }
  .help-card ul { margin: 0; padding-left: 16px; }
  .help-card li { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 3px; }
  .help-card b { color: var(--text); font-weight: 600; }

  /* ===== MODAL ===== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--panel-2);
    border-radius: 14px; max-width: 440px; width: 100%;
    padding: 18px; color: var(--text);
  }
  .modal h3 {
    margin: 0 0 4px; font-size: 16px; font-weight: 700;
  }
  .modal .modal-desc {
    font-size: 12px; color: var(--muted); margin: 0 0 12px;
  }
  .modal .modal-input {
    width: 100%; padding: 9px 10px; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--panel-2); border-radius: 8px;
    box-sizing: border-box;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .modal .modal-input:focus { outline: none; border-color: var(--accent); }
  .modal .modal-actions {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .modal .modal-btn {
    flex: 1; min-width: 80px;
    padding: 8px 10px; font-size: 12px; font-weight: 600;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--panel-2); border-radius: 8px;
    cursor: pointer;
  }
  .modal .modal-btn.primary { background: var(--accent); color: #052433; border-color: var(--accent); }
  .modal .modal-btn.danger { color: var(--lvl-red); }
  .modal .modal-msg {
    margin-top: 10px; font-size: 11px;
    padding: 6px 10px; border-radius: 6px;
    background: var(--bg); color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    min-height: 14px;
  }
  .modal .modal-msg.ok { color: var(--ok); }
  .modal .modal-msg.err { color: var(--lvl-red); }

  /* ===== MOCK NOTICE ===== */
  .mock-notice {
    background: #422006; color: #fbbf24;
    padding: 6px 14px; font-size: 11px; text-align: center;
    border-bottom: 1px solid var(--border);
  }

function totals() {

  for (const c of data) for (const v of c.counts) {
    if (v === 0) miss++;
    else { owned++; if (v === 1) single++; else if (v >= 2) dupes += v - 1; }
  }
  return { owned, dupes, miss, single, total: data.reduce((s,c)=>s+c.counts.length,0) };
}
function countryStats(code) {
  const c = data.find(d => d.code === code);
  if (!c) return { owned: 0, dupes: 0 };
  let owned = 0, dupes = 0;
  for (const v of c.counts) {
    if (v >= 1) owned++;
    if (v >= 2) dupes += v - 1;
  }
  return { owned, dupes };
}
function groupStats(group) {
  const list = data.filter(d => d.group === group);
  let owned = 0, total = 0;
  for (const c of list) for (const v of c.counts) { total++; if (v >= 1) owned++; }
  return { owned, total };
}

function helpInner(title, items) {
  return `<div class="help-title">${title}</div><ul>${items.map(t => `<li>${t}</li>`).join("")}</ul>`;
}
function helpCard(title, items) {
  return `<div class="help-card">${helpInner(title, items)}</div>`;
}
function setHelp(parentEl, title, items) {
  let card = parentEl.querySelector(":scope > .help-card");
  if (!card) { card = document.createElement("div"); card.className = "help-card"; }
  card.innerHTML = helpInner(title, items);
  parentEl.appendChild(card);
}

/* ===== TOP BAR ===== */
function renderTopbar() {
  const t = totals();
  document.getElementById("owned-count").textContent = t.owned;
  document.getElementById("total-count").textContent = t.total;
  document.getElementById("ok-count").textContent = t.single;
  document.getElementById("dupes-count").textContent = t.dupes;
  document.getElementById("miss-count").textContent = t.miss;
  const pct = t.total ? Math.round((t.owned / t.total) * 100) : 0;
  document.getElementById("progress-pct").textContent = pct + "%";
  const pbar = document.getElementById("progress-bar");
  pbar.style.width = pct + "%";
  pbar.style.background = barColor(t.owned, t.total);

  const back = document.getElementById("back-btn");
  const title = document.getElementById("top-title");
  if (view === "country") {
    back.classList.remove("hidden");
  } else {
    back.classList.add("hidden");
  }
  title.textContent = "Figurinhas Copa 2026";
}

/* ===== HOME (2-col group cards) ===== */
function renderHome() {
  const grid = document.getElementById("home-grid");
  grid.innerHTML = "";
  for (const g of GROUPS_ORDER) {
    const list = data.filter(d => d.group === g);
    if (list.length === 0) continue;
    const gs = groupStats(g);
    const pct = gs.total ? (gs.owned / gs.total) * 100 : 0;
    const head = list[0];

    const card = document.createElement("div");
    card.className = "group-card" + (gs.owned === gs.total ? " complete" : "");

    const rows = list.map(c => {
      const cs = countryStats(c.code);
      const cpct = (cs.owned / 20) * 100;
      const ccolor = barColor(cs.owned, 20);
      return `
        <div class="gc-row">
          <span class="gc-flag">${flagFor(c.code)}</span>
          <span class="gc-code">${c.code}</span>
          <span class="gc-pbar"><div style="width:${cpct}%; background:${ccolor};"></div></span>
          <span class="gc-dupes">${cs.dupes ? cs.dupes : ""}</span>
        </div>
      `;
    }).join("");

    card.innerHTML = `
      <div class="gc-head">
        <span class="gc-name">${g === "FWC" ? "FWC" : "Group " + g}</span>
        <span class="gc-count">${gs.owned}/${gs.total}</span>
      </div>
      <div class="gc-bar"><div style="width:${pct}%; background:${barColor(gs.owned, gs.total)};"></div></div>
      <div class="gc-list">${rows}</div>
    `;
    card.onclick = () => goToCountry(head.code);
    grid.appendChild(card);
  }
  setHelp(document.getElementById("home"), "Como usar · Álbum", [
    "Toque num grupo pra abrir os países dele.",
    "As barrinhas mostram <b>quantas figurinhas você tem</b> de cada país: <b>🔴 até 5</b>, <b>🟠 6-10</b>, <b>🟡 11-15</b>, <b>🟢 16-20</b>.",
    "O número à direita de cada país é quantas <b>repetidas</b> você tem dele.",
    "Terminou de atualizar? Toque em <b>Backup → Exportar</b> pra salvar sua coleção e não perder nada (se trocar de celular ou limpar o navegador).",
    "Pra usar no PC ou em outro celular: <b>Backup → Exportar</b> aqui, mande o arquivo pra você (WhatsApp/Drive) e <b>Backup → Importar</b> no outro aparelho."
  ]);
}

/* ===== COUNTRY ===== */
function renderGroupTabs() {
  const el = document.getElementById("group-tabs");
  el.innerHTML = "";
  for (const g of GROUPS_ORDER) {
    const b = document.createElement("button");
    b.className = "group-tab" + (g === activeGroup ? " active" : "");
    b.textContent = g;
    b.onclick = () => {
      activeGroup = g;
      const first = data.find(d => d.group === g);
      if (first) activeCode = first.code;
      renderCountryView();
      window.scrollTo(0, 0);
    };
    el.appendChild(b);
  }
}
function renderCountryPills() {
  const el = document.getElementById("country-pills");
  el.innerHTML = "";
  const list = data.filter(d => d.group === activeGroup);
  const span = list.length === 1 ? " span-2" : "";
  for (const c of list) {
    const stats = countryStats(c.code);
    const pct = (stats.owned / 20) * 100;
    const color = barColor(stats.owned, 20);
    const pill = document.createElement("div");
    pill.className = "country-pill" + span + (c.code === activeCode ? " active" : "");
    const dupesHtml = stats.dupes ? ` · <span class="meta-dupes">${stats.dupes}</span>` : "";
    pill.innerHTML = `
      <div class="pill-name">${c.code}</div>
      <div class="pill-meta">${c.country} · <span class="meta-owned" style="color:${color}">${stats.owned}</span>${dupesHtml}</div>
      <div class="pill-bar"><div style="width:${pct}%; background:${color};"></div></div>
    `;
    pill.onclick = () => {
      activeCode = c.code;
      renderCountryPills();
      const block = document.getElementById("block-" + c.code);
      if (block) block.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    el.appendChild(pill);
  }
}
// FWC: a "Panini Logo" é guardada internamente como FWC20 (idx 19),
// mas deve aparecer primeiro e rotulada como FWC00.
function displayNum(code, idx) {
  if (code === "FWC" && idx === 19) return "00";
  return String(idx + 1);
}
function displayId(code, idx) {
  return code + displayNum(code, idx);
}
function tileOrder(c) {
  const order = c.counts.map((_, i) => i);
  if (c.code === "FWC") return [19, ...order.slice(0, 19)];
  return order;
}
function countryMetaText(code) {
  const stats = countryStats(code);
  return `${stats.owned} / 20${stats.dupes ? ` · ${stats.dupes} repetidas` : ""}`;
}
function renderGroupGrids() {
  const wrap = document.getElementById("group-blocks");
  wrap.innerHTML = "";
  const list = data.filter(d => d.group === activeGroup);
  for (const c of list) {
    const block = document.createElement("div");
    block.className = "country-block";
    block.id = "block-" + c.code;

    const header = document.createElement("div");
    header.className = "country-header";
    header.innerHTML = `
      <h2>${c.country} (${c.code})</h2>
      <div class="header-meta" data-meta="${c.code}">${countryMetaText(c.code)}</div>
    `;
    block.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "grid";
    for (const i of tileOrder(c)) grid.appendChild(buildTile(c, i));
    block.appendChild(grid);

    wrap.appendChild(block);
  }
}
function renderCountryView() {
  renderGroupTabs();
  renderCountryPills();
  renderGroupGrids();
  setHelp(document.getElementById("country"), "Como usar · Figurinhas", [
    "Toque numa figurinha pra somar <b>+1</b>.",
    "Segure (toque longo) pra <b>tirar 1</b>.",
    "<b>Arraste a tela pra esquerda</b> pra ir pro próximo grupo (pra direita volta).",
    "Toque num país nas abas de cima pra <b>pular direto</b> pra ele.",
    "Sem cor = falta · preenchida = você tem · <b>azul (+N)</b> = repetidas · borda dourada = especial."
  ]);
}

function buildTile(country, idx) {
  const tile = document.createElement("div");
  tile.dataset.idx = idx;
  paintTile(tile, country, idx);
  attachTileHandlers(tile, country, idx);
  return tile;
}
function paintTile(tile, country, idx) {
  const v = country.counts[idx];
  let cls = "tile";
  if (v === 1) cls += " ok";
  else if (v >= 2) cls += " trade";
  const isFoil = (FOILS[country.code] || [])[idx];
  if (isFoil) cls += v === 0 ? " foil foil-miss" : " foil foil-owned";
  tile.className = cls;
  const arr = NAMES[country.code] || [];
  const name = arr[idx] || "—";
  tile.innerHTML = `
    <div class="name">${name}</div>
    <div class="id">${displayId(country.code, idx)}</div>
    ${v >= 2 ? `<span class="badge">+${v - 1}</span>` : ""}
  `;
}
function attachTileHandlers(tile, country, idx) {
  let pressTimer = null;
  let longPressed = false;
  let pointerId = null;
  let moved = false;
  let startX = 0, startY = 0;

  tile.addEventListener("pointerdown", e => {
    e.preventDefault();
    pointerId = e.pointerId;
    longPressed = false;
    moved = false;
    startX = e.clientX; startY = e.clientY;
    tile.setPointerCapture(pointerId);
    pressTimer = setTimeout(() => {
      if (moved) return;
      longPressed = true;
      decrement(country, idx, tile);
      if (navigator.vibrate) navigator.vibrate(20);
    }, 450);
  });
  tile.addEventListener("pointermove", e => {
    if (pointerId === null) return;
    if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
      moved = true;
      clearTimeout(pressTimer);
    }
  });
  tile.addEventListener("pointerup", e => {
    clearTimeout(pressTimer);
    if (pointerId !== null && tile.hasPointerCapture(pointerId)) tile.releasePointerCapture(pointerId);
    const wasLong = longPressed, wasMoved = moved;
    pointerId = null;
    if (!wasLong && !wasMoved) increment(country, idx, tile);
  });
  tile.addEventListener("pointercancel", () => { clearTimeout(pressTimer); pointerId = null; });
  tile.addEventListener("contextmenu", e => e.preventDefault());
}

function increment(country, idx, tile) {
  country.counts[idx] += 1;
  saveData();
  paintTile(tile, country, idx);
  refreshAfterTileChange(country.code);
}
function decrement(country, idx, tile) {
  if (country.counts[idx] > 0) country.counts[idx] -= 1;
  saveData();
  paintTile(tile, country, idx);
  refreshAfterTileChange(country.code);
}
function refreshAfterTileChange(code) {
  renderTopbar();
  renderCountryPills();
  const meta = document.querySelector(`#group-blocks [data-meta="${code}"]`);
  if (meta) meta.textContent = countryMetaText(code);
}


function getTradeItems() {
  const items = [];
  for (const c of data) {
    for (let i = 0; i < c.counts.length; i++) {
      if (c.counts[i] >= 2) {
        items.push({
          code: c.code, group: c.group, country: c.country,
          idx: i, dupes: c.counts[i] - 1,
          name: (NAMES[c.code] || [])[i] || "—",
          foil: ((FOILS[c.code] || [])[i]) || false
        });
      }
    }
  }
  return items;
}
function renderTrade() {
  const screen = document.getElementById("trade");
  const items = getTradeItems();
  const totalDupes = items.reduce((s, x) => s + x.dupes, 0);
  let html = `
    <div class="trade-summary">
      <span class="ts-num">${totalDupes}</span>
      <span class="ts-label">repetida${totalDupes === 1 ? "" : "s"} pra trocar</span>
    </div>
  `;
  if (items.length === 0) {
    html += `<div class="trade-empty">Nenhuma repetida ainda. Quando você marcar uma figurinha que já tem, ela aparece aqui.</div>`;
    html += tradeHelp();
    screen.innerHTML = html;
    return;
  }
  const byGroup = {};
  for (const it of items) (byGroup[it.group] = byGroup[it.group] || []).push(it);
  for (const g of GROUPS_ORDER) {
    const list = byGroup[g];
    if (!list || list.length === 0) continue;
    const groupDupes = list.reduce((s, x) => s + x.dupes, 0);
    const groupLabel = g === "FWC" ? "FWC" : "Group " + g;
    let rows = "";
    for (const it of list) {
      const star = it.foil ? '<span class="tr-foil">★</span>' : '';
      rows += `
        <div class="trade-row-wrap">
          <div class="trade-row-action">−1</div>
          <div class="trade-row" data-code="${it.code}" data-idx="${it.idx}">
            <div class="tr-code">${star}${displayId(it.code, it.idx)}</div>
            <div class="tr-info">
              <div class="tr-name">${it.name}</div>
              <div class="tr-country">${it.country}</div>
            </div>
            <span class="tr-count">×${it.dupes}</span>
          </div>
        </div>
      `;
    }
    html += `
      <div class="trade-group">
        <div class="trade-group-header">
          <span>${groupLabel}</span>
          <span class="tgh-count">×${groupDupes}</span>
        </div>
        <div class="trade-list">${rows}</div>
      </div>
    `;
  }
  html += tradeHelp();
  screen.innerHTML = html;
  for (const row of screen.querySelectorAll(".trade-row")) {
    attachTradeSwipe(row);
  }
}
function tradeHelp() {
  return helpCard("Como usar · Trade", [
    "Lista das suas <b>repetidas</b> (o que dá pra trocar).",
    "Arraste uma figurinha <b>pra esquerda</b> pra tirar 1 (quando você trocar).",
    "★ = figurinha especial (foil).",
    "Cada linha mostra código, nome do jogador e quantas você tem sobrando."
  ]);
}
function decrementByCode(code, idx) {
  const c = data.find(d => d.code === code);
  if (!c) return;
  if (c.counts[idx] > 0) c.counts[idx] -= 1;
  saveData();
}
function attachTradeSwipe(row) {
  const code = row.dataset.code;
  const idx = parseInt(row.dataset.idx, 10);
  let startX = 0, startY = 0, active = false, decided = false, horizontal = false, dx = 0;
  const THRESHOLD = 60, MAX = 120;
  row.addEventListener("pointerdown", e => {
    active = true; decided = false; horizontal = false; dx = 0;
    startX = e.clientX; startY = e.clientY;
    row.style.transition = "none";
  });
  row.addEventListener("pointermove", e => {
    if (!active) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!decided && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      decided = true;
      horizontal = Math.abs(dx) > Math.abs(dy);
      if (horizontal) { try { row.setPointerCapture(e.pointerId); } catch (_) {} }
    }
    if (horizontal && dx < 0) {
      e.preventDefault();
      row.style.transform = "translateX(" + Math.max(dx, -MAX) + "px)";
    }
  });
  function finish() {
    if (!active) return;
    active = false;
    row.style.transition = "transform 0.18s ease";
    if (horizontal && dx <= -THRESHOLD) {
      row.style.transform = "translateX(-100%)";
      if (navigator.vibrate) navigator.vibrate(20);
      setTimeout(() => { decrementByCode(code, idx); renderTrade(); renderTopbar(); }, 160);
    } else {
      row.style.transform = "translateX(0)";
    }
  }
  row.addEventListener("pointerup", finish);
  row.addEventListener("pointercancel", finish);
}


function buildPerCountryStats() {
  return data.map(c => {
    let owned = 0, dupes = 0;
    for (const v of c.counts) { if (v >= 1) owned++; if (v >= 2) dupes += v - 1; }
    return { code: c.code, country: c.country, group: c.group, owned, dupes, total: c.counts.length };
  });
}
function foilStats() {
  let owned = 0, total = 0, dupes = 0;
  for (const c of data) {
    const cf = FOILS[c.code] || [];
    for (let i = 0; i < c.counts.length; i++) {
      if (!cf[i]) continue;
      total++;
      if (c.counts[i] >= 1) owned++;
      if (c.counts[i] >= 2) dupes += c.counts[i] - 1;
    }
  }
  return { owned, total, dupes };
}
function statsRow(c, statHtml, extraClass) {
  return `
    <div class="stats-row ${extraClass || ""}" data-code="${c.code}">
      <span class="sr-flag">${flagFor(c.code)}</span>
      <span class="sr-code">${c.code}</span>
      <span class="sr-name">${c.country}</span>
      <span class="sr-stat">${statHtml}</span>
    </div>
  `;
}
function renderStats() {
  const screen = document.getElementById("stats");
  const t = totals();
  const pct = t.total ? Math.round((t.owned / t.total) * 100) : 0;
  const color = barColor(t.owned, t.total);
  const per = buildPerCountryStats();
  const completedCount = per.filter(c => c.owned === c.total).length;
  const f = foilStats();
  const fpct = f.total ? Math.round((f.owned / f.total) * 100) : 0;

  const almost = per.filter(c => c.owned >= 16 && c.owned < 20)
                    .sort((a,b) => b.owned - a.owned);
  const need = per.filter(c => c.owned <= 5)
                  .sort((a,b) => a.owned - b.owned);
  const dupes = per.filter(c => c.dupes > 0)
                   .sort((a,b) => b.dupes - a.dupes)
                   .slice(0, 8);

  const okCount = t.single;

  let html = `
    <div class="stats-hero">
      <div class="sh-row">
        <span class="sh-num">${pct}%</span>
        <span class="sh-pct">${t.owned} / ${t.total}</span>
      </div>
      <div class="sh-sub">${completedCount} de ${per.length} países completos</div>
      <div class="sh-bar"><div style="width:${pct}%; background:${color};"></div></div>
    </div>
    <div class="stats-quad">
      <div class="stat-card">
        <div class="sc-num">${okCount}</div>
        <div class="sc-label">únicas que tenho</div>
      </div>
      <div class="stat-card miss">
        <div class="sc-num">${t.miss}</div>
        <div class="sc-label">faltando</div>
      </div>
      <div class="stat-card foils">
        <div class="sc-num">${f.owned}<span class="sc-sub"> / ${f.total}</span></div>
        <div class="sc-label">foils que tenho (${fpct}%)</div>
      </div>
      <div class="stat-card dupes">
        <div class="sc-num">${t.dupes}</div>
        <div class="sc-label">repetidas no total</div>
      </div>
    </div>
  `;

  // Almost there
  html += `
    <div class="stats-section">
      <div class="stats-section-title">
        <span>Quase lá</span>
        <span class="sst-hint">${almost.length} ${almost.length === 1 ? "país" : "países"} ≥ 16/20</span>
      </div>
      <div class="stats-list">
  `;
  if (almost.length === 0) {
    html += `<div class="stats-empty">Nenhum país com 16+/20 ainda. Continue!</div>`;
  } else {
    for (const c of almost) {
      const remaining = c.total - c.owned;
      html += statsRow(c, `${c.owned}/${c.total} <span style="color:var(--muted); font-weight:500; font-size:11px;">· faltam ${remaining}</span>`);
    }
  }
  html += `</div></div>`;

  // Need work
  html += `
    <div class="stats-section">
      <div class="stats-section-title">
        <span>Precisa atenção</span>
        <span class="sst-hint">${need.length} ${need.length === 1 ? "país" : "países"} ≤ 5/20</span>
      </div>
      <div class="stats-list">
  `;
  if (need.length === 0) {
    html += `<div class="stats-empty">Nada no vermelho. Boa!</div>`;
  } else {
    for (const c of need) {
      html += statsRow(c, `<span style="color:var(--lvl-red);">${c.owned}</span>/${c.total}`);
    }
  }
  html += `</div></div>`;

  // Most dupes
  html += `
    <div class="stats-section">
      <div class="stats-section-title">
        <span>Mais repetidas</span>
        <span class="sst-hint">poder de troca</span>
      </div>
      <div class="stats-list">
  `;
  if (dupes.length === 0) {
    html += `<div class="stats-empty">Nenhuma repetida ainda.</div>`;
  } else {
    for (const c of dupes) {
      html += statsRow(c, `×${c.dupes}`, "dupes");
    }
  }
  html += `</div></div>`;

  html += helpCard("Como usar · Status", [
    "Visão geral da coleção (só leitura).",
    "<b>Quase lá</b>: quase completos · <b>Precisa atenção</b>: falta muito · <b>Mais repetidas</b>: maior poder de troca.",
    "Toque em qualquer país nas listas pra ir direto pra ele.",
    "Trocou uma figurinha? Vá na aba <b>Trade</b> e arraste ela pra esquerda: o Álbum já atualiza o número certo automaticamente."
  ]);
  screen.innerHTML = html;
  for (const row of screen.querySelectorAll(".stats-row")) {
    row.onclick = () => goToCountry(row.dataset.code);
  }
}

/* ===== MATCH ===== */
let loadedMatch = null; // { owner, dupes:Set, missing:Set }

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function myStickerSets() {
  const dupes = new Set(), missing = new Set();
  for (const c of data) {
    for (let i = 0; i < c.counts.length; i++) {
      const id = c.code + (i + 1);
      if (c.counts[i] >= 2) dupes.add(id);
      else if (c.counts[i] === 0) missing.add(id);
    }
  }
  return { dupes, missing };
}
function stickerInfo(id) {
  const code = id.slice(0, 3);
  const idx = parseInt(id.slice(3), 10) - 1;
  const c = data.find(d => d.code === code);
  return {
    code, idx,
    country: c ? c.country : code,
    group: c ? c.group : "?",
    name: (NAMES[code] || [])[idx] || "—",
    foil: ((FOILS[code] || [])[idx]) || false
  };
}
function generateMatchFile() {
  const me = myStickerSets();
  const last = localStorage.getItem("fwc_match_name") || "";
  const typed = prompt("Seu nome (vai aparecer pro seu amigo):", last);
  if (typed === null) return;
  const name = typed.trim() || "Anônimo";
  localStorage.setItem("fwc_match_name", name);
  downloadJson({
    app: "figurinhas-copa-2026", type: "match", version: 1,
    owner: name, generatedAt: new Date().toISOString(),
    dupes: [...me.dupes], missing: [...me.missing]
  }, "match-" + name.replace(/\s+/g, "_") + "-" + new Date().toISOString().slice(0, 10) + ".json");
  setMatchMsg("Arquivo de match gerado. Envie pro seu amigo.", "ok");
}
function loadMatchFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const p = JSON.parse(reader.result);
      if (p.type !== "match" || !Array.isArray(p.dupes) || !Array.isArray(p.missing)) {
        throw new Error("não é um arquivo de match válido");
      }
      loadedMatch = { owner: p.owner || "amigo", dupes: new Set(p.dupes), missing: new Set(p.missing) };
      renderMatch();
    } catch (err) {
      setMatchMsg("Falhou: " + err.message, "err");
    }
  };
  reader.onerror = () => setMatchMsg("não consegui ler o arquivo", "err");
  reader.readAsText(file);
}
function setMatchMsg(text, kind) {
  const el = document.getElementById("match-msg");
  if (!el) return;
  el.textContent = text || "";
  el.classList.remove("ok", "err");
  if (kind) el.classList.add(kind);
}
function matchSection(title, emptyHint, ids, accent) {
  let html = `<div class="match-section"><div class="match-section-title"><span>${title}</span><span class="mst-hint">${ids.length}</span></div>`;
  if (ids.length === 0) { html += `<div class="match-empty-sm">${emptyHint}</div></div>`; return html; }
  const byGroup = {};
  for (const id of ids) { const inf = stickerInfo(id); (byGroup[inf.group] = byGroup[inf.group] || []).push({ id, inf }); }
  for (const g of GROUPS_ORDER) {
    const list = byGroup[g];
    if (!list || list.length === 0) continue;
    const sk = x => (x.inf.code === "FWC" && x.inf.idx === 19) ? -1 : x.inf.idx;
    list.sort((a, b) => sk(a) - sk(b));
    const label = g === "FWC" ? "FWC" : "Grupo " + g;
    html += `<div class="match-group"><div class="match-group-h">${label}</div>`;
    for (const { id, inf } of list) {
      const star = inf.foil ? '<span class="tr-foil">★</span>' : '';
      html += `
        <div class="match-row">
          <div class="mr-code ${accent}">${star}${displayId(inf.code, inf.idx)}</div>
          <div class="mr-info">
            <div class="mr-name">${inf.name}</div>
            <div class="mr-country">${inf.country}</div>
          </div>
        </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}
function renderMatch() {
  const screen = document.getElementById("match");
  let html = `
    <div class="match-actions">
      <button class="match-btn primary" id="match-generate">Gerar meu arquivo</button>
      <button class="match-btn" id="match-load">Carregar de um amigo</button>
      <input type="file" id="match-file" accept="application/json,.json" class="hidden">
    </div>
    <div class="match-msg" id="match-msg"></div>
  `;
  if (!loadedMatch) {
    html += `<div class="match-empty">Carregue o arquivo de match de um amigo pra ver o que vocês podem trocar.</div>`;
    html += matchHelp();
    screen.innerHTML = html;
    appendMatchReset();
    wireMatchControls();
    return;
  }
  const me = myStickerSets();
  const iReceive = [...loadedMatch.dupes].filter(id => me.missing.has(id));
  const iGive = [...me.dupes].filter(id => loadedMatch.missing.has(id));
  html += `
    <div class="match-hero">
      <div>
        <div class="mh-owner">Match com ${loadedMatch.owner}</div>
        <div class="mh-sub">${iReceive.length} pra receber · ${iGive.length} pra dar</div>
      </div>
      <button class="mh-reset" id="match-clear">Carregar outro</button>
    </div>
  `;
  html += matchSection("Você recebe de " + loadedMatch.owner, "Nada por aqui: o que ele tem sobrando, você já tem.", iReceive, "recv");
  html += matchSection("Você dá pra " + loadedMatch.owner, "Nada por aqui: o que ele precisa, você não tem repetida.", iGive, "give");
  html += matchHelp();
  screen.innerHTML = html;
  appendMatchReset();
  wireMatchControls();
}
function matchHelp() {
  return helpCard("Como usar · Match", [
    "<b>Gerar meu arquivo</b>: cria um arquivo com o que você tem sobrando e o que falta, pra enviar a um amigo.",
    "<b>Carregar de um amigo</b>: abra o arquivo que ele te mandou.",
    "<b>Verde</b> = você recebe dele · <b>Azul</b> = você dá pra ele.",
    "<b>Carregar outro</b>: troca pro arquivo de outro amigo.",
    "<b>Zerar minha coleção</b>: apaga tudo (faça Backup antes)."
  ]);
}
function appendMatchReset() {
  const screen = document.getElementById("match");
  screen.innerHTML += `
    <div class="match-reset-wrap">
      <button class="match-reset" id="match-reset">Zerar minha coleção</button>
    </div>
  `;
}
function wireMatchControls() {
  const gen = document.getElementById("match-generate");
  const load = document.getElementById("match-load");
  const file = document.getElementById("match-file");
  const clear = document.getElementById("match-clear");
  if (gen) gen.onclick = generateMatchFile;
  if (load) load.onclick = () => file.click();
  if (file) file.onchange = () => {
    const f = file.files && file.files[0];
    if (f) loadMatchFile(f);
    file.value = "";
  };
  if (clear) clear.onclick = () => { loadedMatch = null; renderMatch(); };
  const reset = document.getElementById("match-reset");
  if (reset) reset.onclick = resetCollection;
}

/* ===== ROUTING ===== */
function setActiveTab(tab) {
  for (const t of ["album", "trade", "stats", "match"]) {
    const el = document.getElementById("tab-" + t);
    if (el) el.classList.toggle("active", tab === t);
  }
}
function showOnly(id) {
  for (const sid of ["home", "country", "trade", "stats", "match"]) {
    document.getElementById(sid).classList.toggle("hidden", sid !== id);
  }
}
function goToHome() {
  view = "home";
  setActiveTab("album");
  showOnly("home");
  renderHome();
  renderTopbar();
  window.scrollTo(0, 0);
}
function goToCountry(code) {
  view = "country";
  setActiveTab("album");
  activeCode = code;
  const c = data.find(d => d.code === code);
  activeGroup = c ? c.group : "A";
  showOnly("country");
  renderCountryView();
  renderTopbar();
  window.scrollTo(0, 0);
}
function changeGroup(delta) {
  const groups = GROUPS_ORDER.filter(g => data.some(d => d.group === g));
  const i = groups.indexOf(activeGroup);
  const ni = i + delta;
  if (i === -1 || ni < 0 || ni >= groups.length) return;
  activeGroup = groups[ni];
  const first = data.find(d => d.group === activeGroup);
  activeCode = first ? first.code : null;
  renderCountryView();
  renderTopbar();
  window.scrollTo(0, 0);
}
(function attachGroupSwipe() {
  const el = document.getElementById("country");
  let sx = 0, sy = 0, tracking = false;
  el.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { tracking = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  el.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      changeGroup(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();
function goToTrade() {
  view = "trade";
  setActiveTab("trade");
  showOnly("trade");
  renderTrade();
  renderTopbar();
  window.scrollTo(0, 0);
}
function goToStats() {
  view = "stats";
  setActiveTab("stats");
  showOnly("stats");
  renderStats();
  renderTopbar();
  window.scrollTo(0, 0);
}
function goToMatch() {
  view = "match";
  setActiveTab("match");
  showOnly("match");
  renderMatch();
  renderTopbar();
  window.scrollTo(0, 0);
}

document.getElementById("back-btn").onclick = goToHome;
document.getElementById("tab-album").onclick = goToHome;
document.getElementById("tab-trade").onclick = goToTrade;
document.getElementById("tab-stats").onclick = goToStats;
document.getElementById("tab-match").onclick = goToMatch;
function resetCollection() {
  if (!confirm("Apagar tudo e voltar à coleção zerada? (faça um Backup antes se quiser guardar)")) return;
  localStorage.removeItem(STORAGE_KEY);
  data = sortByAlbum(JSON.parse(JSON.stringify(ORIGINAL)));
  renderMatch();
  renderTopbar();
}

function exportData() {
  const payload = {
    app: "figurinhas-copa-2026",
    version: 1,
    exportedAt: new Date().toISOString(),
    data: data.map(c => ({ code: c.code, counts: c.counts.slice() }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "figurinhas-copa-2026-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importData(file, onDone) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.data;
      if (!Array.isArray(incoming)) throw new Error("formato inválido");
      let applied = 0;
      for (const item of incoming) {
        if (!item || typeof item.code !== "string" || !Array.isArray(item.counts)) continue;
        const c = data.find(d => d.code === item.code);
        if (c && item.counts.length === c.counts.length) {
          c.counts = item.counts.map(v => Number(v) || 0);
          applied++;
        }
      }
      if (applied === 0) throw new Error("nenhum país reconhecido no arquivo");
      saveData();
      onDone(null, applied);
    } catch (err) {
      onDone(err);
    }
  };
  reader.onerror = () => onDone(new Error("não consegui ler o arquivo"));
  reader.readAsText(file);
}

(function wireSettings() {
  const modal = document.getElementById("settings-modal");
  const msg = document.getElementById("settings-msg");
  const fileInput = document.getElementById("import-file");
  function setMsg(text, kind) {
    msg.textContent = text || "";
    msg.classList.remove("ok", "err");
    if (kind) msg.classList.add(kind);
  }
  function open() { setMsg(""); modal.classList.remove("hidden"); }
  function close() { modal.classList.add("hidden"); }
  function rerender() {
    if (view === "home") renderHome();
    else if (view === "country") renderCountryView();
    else if (view === "trade") renderTrade();
    else if (view === "stats") renderStats();
    renderTopbar();
  }
  document.getElementById("settings-btn").onclick = open;
  document.getElementById("settings-close").onclick = close;
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  document.getElementById("backup-export").onclick = () => {
    exportData();
    setMsg("Backup exportado. Guarde o arquivo em lugar seguro.", "ok");
  };
  document.getElementById("backup-import").onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (!confirm("Importar vai substituir sua coleção atual. Continuar?")) { fileInput.value = ""; return; }
    importData(file, (err, applied) => {
      fileInput.value = "";
      if (err) { setMsg("Falhou: " + err.message, "err"); return; }
      setMsg("Importado: " + applied + " países atualizados.", "ok");
      rerender();
    });
  };
})();

goToHome();
</script>
